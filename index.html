<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Lector de Carnet</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>
    <h1>Demo: Lector de Carnet de Identidad</h1>
    
    <div>
        <h2>1. Capturar imagen del carnet</h2>
        <input type="file" id="inputImagen" accept="image/*">
        <button id="btnCamara">Usar Camara</button>
        <video id="video" width="300" style="display:none;" autoplay></video>
        <button id="btnCapturar" style="display:none;">Capturar</button>
        <canvas id="canvas" style="display:none;"></canvas>
    </div>

    <div>
        <h2>2. Imagen capturada</h2>
        <img id="imagenPreview" width="300" style="border: 1px solid #ccc;">
    </div>

    <div>
        <button id="btnProcesar" disabled>Procesar con OCR</button>
        <p id="estado">Esperando imagen...</p>
    </div>

    <div>
        <h2>3. Datos extraidos</h2>
        <form id="formulario">
            <label>RUT:</label><br>
            <input type="text" id="rut" name="rut"><br><br>
            
            <label>Nombre:</label><br>
            <input type="text" id="nombre" name="nombre"><br><br>
            
            <label>Apellido Paterno:</label><br>
            <input type="text" id="apellidoPaterno" name="apellidoPaterno"><br><br>
            
            <label>Apellido Materno:</label><br>
            <input type="text" id="apellidoMaterno" name="apellidoMaterno"><br><br>
            
            <label>Fecha de Nacimiento:</label><br>
            <input type="text" id="fechaNacimiento" name="fechaNacimiento"><br><br>
            
            <button type="submit">Enviar formulario</button>
        </form>
    </div>

    <!-- Seccion de confirmacion -->
    <div id="confirmacion" style="display:none; margin-top: 20px; padding: 15px; background-color: #e8f5e9; border: 1px solid #4caf50; border-radius: 5px; max-width: 400px;">
        <h3>Datos enviados correctamente:</h3>
        <p><strong>RUT:</strong> <span id="confRut"></span></p>
        <p><strong>Nombre:</strong> <span id="confNombre"></span></p>
        <p><strong>Apellido Paterno:</strong> <span id="confApPat"></span></p>
        <p><strong>Apellido Materno:</strong> <span id="confApMat"></span></p>
        <p><strong>Fecha de Nacimiento:</strong> <span id="confFecha"></span></p>
        <p style="color: #2e7d32; font-weight: bold;">Formulario procesado exitosamente</p>
    </div>

    <script src="app.js"></script>
</body>
</html>
